# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-added-large-files" },
  { id = "no-commit-to-branch" },
  {
    id = "mixed-line-ending",
    args = ["--fix=lf"]
  }
]

[[repos]]
repo = "https://github.com/rohaquinlop/complexipy-pre-commit"
rev = "v8.0.1"
hooks = [
  { id = "complexipy", pass_filenames = false }
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.79"
hooks = [
  { id = "rumdl", args = ["--fix"] }
]

[[repos]]
repo = "https://github.com/adhtruong/mirrors-typos"
rev = "v1.51.1"
hooks = [
  {
    id = "typos",
    args = ["--force-exclude"]
  }
]

[[repos]]
repo = "https://github.com/woodruffw/zizmor-pre-commit"
rev = "v1.31.1"
hooks = [
  {
    id = "zizmor",
    args = [
      "--min-severity",
      "low",
      "--min-confidence",
      "medium",
      "--fix=safe"
    ]
  }
]

[[repos]]
repo = "https://github.com/owenlamont/ryl-pre-commit"
rev = "v0.26.0"
hooks = [
  {
    id = "ryl",
    args = [
      "--fix"
    ]
  },
  {
    id = "ryl-markdown",
    args = [
      "--fix"
    ]
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"
hooks = [
  {
    id = "ruff-check",
    args = [
      "--fix",
      "--exit-non-zero-on-fix",
      "--show-fixes"
    ],
    types_or = [
      "python",
      "pyi",
      "jupyter"
    ]
  },
  {
    id = "ruff-format",
    types_or = [
      "python",
      "pyi",
      "jupyter"
    ]
  }
]

# ty type-checking. Deliberately NOT the official ty-pre-commit mirror: that hook runs
# `uv check`, which skips any file carrying a PEP 723 `# /// script` block — uv treats
# those as standalone scripts with environments of their own rather than as part of the
# project. Every bundled script here carries one, so the mirror checked none of them and
# passed on a bare `x: int = "str"` in any of them. `ty check` walks the tree instead,
# which is what actually covers the scripts. Run it through `uv run`, not `uvx`: ty has
# to resolve the scripts' third-party imports, and only `uv run` builds the environment
# from the root pyproject.toml first. The version is pinned in the entry, since a local
# hook has no `rev` for `prek autoupdate` to bump — bump it by hand when a ty release
# clears the `exclude-newer` cooldown.
[[repos]]
repo = "local"
hooks = [
  {
    id = "ty",
    name = "ty",
    entry = "uv run --with ty==0.0.69 ty check",
    language = "system",
    types_or = [
      "python",
      "pyi",
      "jupyter"
    ],
    pass_filenames = false,
    always_run = true,
    require_serial = true
  },
  # Text I/O that names no encoding uses cp1252 on Windows. ruff's PLW1514 covers
  # `open()`; these rules cover what it cannot see. Pinned for the same reason as ty.
  {
    id = "ast-grep",
    name = "ast-grep (explicit UTF-8)",
    entry = "uvx --from ast-grep-cli==0.45.3 ast-grep scan --config sgconfig.yml",
    language = "system",
    types_or = [
      "python",
      "pyi"
    ]
  },
  {
    id = "ast-grep-test",
    name = "ast-grep rule tests",
    entry = "uvx --from ast-grep-cli==0.45.3 ast-grep test --config sgconfig.yml --skip-snapshot-tests",
    language = "system",
    pass_filenames = false,
    files = '^(\.ast-grep/|sgconfig\.yml$)'
  }
]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.5.15"
hooks = [
  { id = "biome-check" }
]
