name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      # `no-commit-to-branch` guards local commits and would fail every push to main.
      - run: uvx prek@0.5.5 run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
      # The suites under `tests/` shell out to `uv run --script`, so each bundled
      # script resolves its own PEP 723 dependencies from the network during the run.
      - run: uv run pytest
