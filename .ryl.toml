[files]
yaml = [
    '**/*.yaml',
    '**/*.yml',
]
# Classify markdown so a bare `ryl .` lints embedded YAML too, matching the
# prek `ryl` + `ryl-markdown` hooks. Mirrors the `ryl-markdown` default globs.
markdown = [
    '**/*.md',
    '**/*.markdown',
    '**/*.mdx',
    '**/*.qmd',
    '**/*.Rmd',
]

# Lint YAML embedded in skill markdown. Front matter is metadata we own, so
# enforce it; fenced ```yaml blocks are illustrative examples that mirror
# external tools' syntax (e.g. CloudFormation needs a quoted
# `AWSTemplateFormatVersion: '2010-09-09'`), so leave them as authored.
[markdown]
front-matter = true
fenced-blocks = false

[lint.rules]
anchors = 'enable'
block-scalar-chomping = 'enable'
comments = 'disable'
comments-indentation = 'disable'
document-end = 'disable'
document-start = 'disable'
empty-values = 'disable'
float-values = 'disable'
key-duplicates = 'enable'
key-ordering = 'disable'
line-length = 'disable'
merge-keys = 'enable'
new-line-at-end-of-file = 'enable'
new-lines = 'enable'
octal-values = 'disable'
tags = 'enable'
trailing-spaces = 'enable'
truthy = 'disable'
unicode-line-breaks = 'enable'

[lint.rules.braces]
level = 'warning'
max-spaces-inside = 1

[lint.rules.brackets]
level = 'warning'
max-spaces-inside = 1

[lint.rules.colons]
level = 'warning'

[lint.rules.commas]
level = 'warning'

[lint.rules.empty-lines]
level = 'warning'

[lint.rules.hyphens]
level = 'warning'

[lint.rules.indentation]
indent-sequences = 'consistent'
level = 'warning'

[lint.rules.quoted-strings]
quote-type = 'single'
required = 'only-when-needed'
allow-double-quotes-for-escaping = true

[lint]
fixable = ["ALL"]
